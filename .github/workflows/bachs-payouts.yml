name: Bachs scheduled payouts and debits
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: bachs-money-runner
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  process:
    # Explicitly disabled until the owner enables it after provider approval and Connect setup.
    if: vars.BACHS_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Process approved Bachs requests
        run: node scripts/run-bachs-cron.mjs
        env:
          SIGMA_API_URL: ${{ secrets.SIGMA_API_URL }}
          BACHS_CRON_SECRET: ${{ secrets.BACHS_CRON_SECRET }}
